name: BookTracker
options:
  bundleIdPrefix: com.olegvornicesku
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: uk
configs:
  Debug: debug
  Release: release
targets:
  BookTracker:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BookTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.olegvornicesku.BookTracker
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_NSCameraUsageDescription: "Застосунку потрібен доступ до камери, щоб сканувати штрихкод книги для швидкого додавання в бібліотеку."
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: "YES"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_ENTITLEMENTS: BookTracker/BookTracker.entitlements
        SWIFT_EMIT_LOC_STRINGS: "YES"
    dependencies:
      - target: BookTrackerWidgetExtension
        embed: true

  BookTrackerWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BookTrackerWidget
      - path: BookTracker/Models
      - path: BookTracker/Services/SharedModelContainer.swift
      - path: BookTracker/DesignSystem
      - path: BookTracker/Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.olegvornicesku.BookTracker.BookTrackerWidget
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: BookTrackerWidget/Info.plist
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_ENTITLEMENTS: BookTrackerWidget/BookTrackerWidget.entitlements
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: "YES"
        SKIP_INSTALL: "YES"

  BookTrackerTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BookTrackerTests
    dependencies:
      - target: BookTracker
        embed: false
    settings:
      base:
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  BookTracker:
    build:
      targets:
        BookTracker: all
        BookTrackerWidgetExtension: all
        BookTrackerTests: [test]
    test:
      targets:
        - BookTrackerTests
    run:
      config: Debug
